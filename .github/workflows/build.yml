name: Build

# Every push and pull request is built and linted.
# Pushing a tag like v0.1 also signs the release APK and publishes it as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        run: ./gradlew assembleDebug lint

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Check that the signing key is set up
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set. See \"Releases\" in README.md."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        run: ./gradlew assembleRelease

      # Signed here rather than by Gradle, so the build files stay free of signing
      # settings and build the same unsigned APK everywhere (F-Droid signs its own).
      - name: Sign the APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keystore="$RUNNER_TEMP/release.jks"
          apk="QuectoLaunch-$VERSION.apk"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
          "$build_tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            "$apk"
          rm "$keystore"
          "$build_tools/apksigner" verify --print-certs "$apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "QuectoLaunch-$VERSION.apk" \
            --verify-tag \
            --title "QuectoLaunch $VERSION" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
